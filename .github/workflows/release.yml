name: Publish signed Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check release tag matches app version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $packageLockVersion = node -p "require('./package-lock.json').packages[''].version"
          $tauriVersion = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content 'src-tauri/Cargo.toml' -Raw), '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (($packageVersion -ne $packageLockVersion) -or ($packageVersion -ne $tauriVersion) -or ($packageVersion -ne $cargoVersion)) {
            throw "Version mismatch: package.json=$packageVersion; package-lock.json=$packageLockVersion; tauri.conf.json=$tauriVersion; Cargo.toml=$cargoVersion"
          }
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME must match app version v$packageVersion"
          }
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD for the password-protected updater key"
          }
      - name: Build and publish signed Tauri update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Bhatta Khata Pro v__VERSION__
          releaseBody: Signed Windows installer and updater artifacts.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
